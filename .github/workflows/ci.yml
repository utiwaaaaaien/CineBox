name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run catalog:check
      - run: pnpm run catalog:cards:check
      - run: pnpm test
      - name: Generate runtime types
        run: pnpm exec wrangler types worker-configuration.d.ts --include-env false --config dist/server/wrangler.json
        env:
          WRANGLER_WRITE_LOGS: "false"
          WRANGLER_LOG_PATH: .wrangler/wrangler.log
      - run: pnpm run typecheck
      - run: pnpm lint
