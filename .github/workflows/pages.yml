name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: pnpm run catalog:check
      - run: pnpm run catalog:cards:check
      - run: pnpm test
      - name: Generate runtime types
        run: pnpm exec wrangler types worker-configuration.d.ts --include-env false --config dist/server/wrangler.json
        env:
          WRANGLER_WRITE_LOGS: "false"
          WRANGLER_LOG_PATH: .wrangler/wrangler.log
      - run: pnpm run typecheck
      - run: pnpm lint
      - name: Build and verify static Pages site
        run: pnpm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish CineBox release after Pages succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            echo "Skipping release without notes for $tag"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; preserving it"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "CineBox V${version%.0}" --notes-file "$notes"
          fi
